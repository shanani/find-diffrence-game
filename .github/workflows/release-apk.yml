name: Build and Release APK

on:
  push:
    branches: [master, main]

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ubuntu-latest runners ship with the Android SDK (platforms, build-tools,
      # accepted licenses) preinstalled; Gradle/AGP auto-downloads any specific
      # missing version on demand, so no separate SDK setup action is needed -
      # android-actions/setup-android also only works at all if the long-gone
      # legacy 'tools' package is still fetchable upstream, which it is not.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore release signing config (optional)
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/release.keystore"
          : > "${{ github.workspace }}/keystore.properties"
          echo "storeFile=${{ github.workspace }}/release.keystore" >> "${{ github.workspace }}/keystore.properties"
          echo "storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> "${{ github.workspace }}/keystore.properties"
          echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}" >> "${{ github.workspace }}/keystore.properties"
          echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}" >> "${{ github.workspace }}/keystore.properties"

      - name: Build release APK
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Locate built APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK produced" >&2
            exit 1
          fi
          cp "$APK_PATH" "OddOneOutDuel-${{ github.run_number }}.apk"
          echo "path=OddOneOutDuel-${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Odd One Out Duel - build ${{ github.run_number }}
          make_latest: true
          files: ${{ steps.apk.outputs.path }}
          body: |
            Automatic build from commit ${{ github.sha }} on `${{ github.ref_name }}`.

            Install directly on your Android TV or tablet (enable "install from unknown sources" if prompted).
